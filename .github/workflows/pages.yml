# Publishes the combined site to GitHub Pages. The site is built locally (its sources take several hundred MB of
# downloads and are not in the repository): `bun run deploy:pages` builds it, uploads dist/site/ as site.tar.gz to the
# `site` release and starts this workflow, which deploys that archive unchanged.
name: Deploy site to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the built site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download site --repo "$GITHUB_REPOSITORY" --pattern site.tar.gz
          mkdir site
          tar -xzf site.tar.gz -C site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
